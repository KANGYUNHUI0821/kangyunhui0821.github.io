<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work — Kang Yunhui</title>
  <style>
    @font-face{ font-family:'NanumBarunpen'; src:url('https://cdn.jsdelivr.net/gh/fontbee/font@main/NAVER/NanumBarunpen.woff') format('woff'); font-weight:400; font-style:normal; font-display:swap; }
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
    :root{ --bg:#fbfbfb; --text:#111; --muted:#6b6b6b; --box:#f1f1f1; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:'NanumBarunpen','Gowun Dodum',system-ui,sans-serif; padding:72px 84px; }
    .container{ max-width:760px; margin:0 auto; }
    .topbar{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:44px; }
    .brand{ font-size:15px; text-decoration:none; color:var(--text); }
    nav a{ margin-left:22px; font-size:13px; text-decoration:none; color:var(--muted); }
    nav a.active{ color:var(--text); text-decoration:underline; text-underline-offset:6px; }
    .back{ display:inline-block; margin:6px 0 18px; font-size:13px; color:var(--muted); text-decoration:none; }
    h1{ margin:0 0 8px; font-size:18px; }
    .meta{ margin:0 0 18px; font-size:13px; color:var(--muted); line-height:1.8; }
    .slider{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; gap:10px; background:transparent; }
    .slide{ flex:0 0 100%; scroll-snap-align:start; }
    .slide img{ width:100%; height:auto; display:block; background:var(--box); cursor:pointer; }
    .slider::-webkit-scrollbar{ height:8px; }
    .dots{ display:flex; gap:6px; margin:10px 0 20px; }
    .dot{ width:6px; height:6px; border-radius:999px; background:#d7d7d7; }
    .dot.active{ background:#111; }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
    #lightbox img { max-width: 90%; max-height: 85%; object-fit: contain; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; color: white; font-size: 60px; cursor: pointer; padding: 20px; z-index: 10001; user-select: none; }
    .prev { left: 10px; } .next { right: 10px; }
    @media (max-width:640px){ body{ padding:32px 18px; } .topbar{ flex-direction:column; align-items:flex-start; gap:14px; margin-bottom:28px; } nav a{ margin-left:0; margin-right:14px; } .nav-btn { font-size: 40px; } }
  </style>
  <script src="data/works.js"></script>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="index.html">강윤희 KANG YUNHUI</a>
      <nav><a href="index.html">Home</a><a href="works.html" class="active">Works</a><a href="about.html">About</a><a href="cv.html">CV</a><a href="contact.html">Contact</a></nav>
    </header>
    <main>
      <a class="back" href="works.html">← Works로 돌아가기</a>
      <h1 id="title">작품</h1>
      <p class="meta" id="meta"></p>
      <div id="slider" class="slider"></div>
      <div id="dots" class="dots"></div>
    </main>
  </div>
  <div id="lightbox">
    <button class="nav-btn prev" id="prevBtn">〈</button>
    <img id="lightboxImg" src="" alt="">
    <button class="nav-btn next" id="nextBtn">〉</button>
  </div>

      return "images/" + filename;
    }

      currentIdx = index;
      lightboxImg.src = imgPath(allImages[currentIdx]);
      lightbox.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function moveImg(step, event) {
      if (event) event.stopPropagation();
      currentIdx += step;
      if (currentIdx < 0) currentIdx = allImages.length - 1;
      if (currentIdx >= allImages.length) currentIdx = 0;
      lightboxImg.src = imgPath(allImages[currentIdx]);
